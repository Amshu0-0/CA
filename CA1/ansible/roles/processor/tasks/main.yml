---
# This role sets up and starts the processor container on the processor VM.

# Create the folder where the pipeline's settings files live on the VM.
- name: Create the settings folder
  file:
    path: /etc/ca1
    state: directory
    mode: "0755"

# Copy the processor program and Dockerfile from the Ansible role onto the processor VM.
- name: Copy processor source and Dockerfile
  copy:
    src: "{{ item }}"
    dest: "/home/ubuntu/{{ item }}"
    mode: "0644"
  loop:
    - processor.py
    - Dockerfile

# Write the processor's settings into an environment file on the VM.
#
# Every value comes from config.yml, the Ansible inventory, or the encrypted Ansible Vault.
# The file contains the MongoDB password, so only root can read it.
# no_log: true keeps the password out of Ansible's output.
- name: Write the processor environment file
  template:
    src: processor.env.j2
    dest: /etc/ca1/processor.env
    mode: "0600"
  no_log: true

# Build the processor Docker image using the Dockerfile that was copied onto the VM.
- name: Build the processor image
  command: docker build -t processor .
  args:
    chdir: /home/ubuntu
  changed_when: false

# Remove an older processor container if one already exists.
# failed_when: false means the playbook will continue even if there is no old container to remove.
- name: Remove any previous processor container
  command: docker rm -f processor
  failed_when: false
  changed_when: false

# Start the processor container.
#
# Docker reads all of the processor's settings from the environment file written above,
# so no address, topic name, or password appears on this command line.
- name: Run the processor container
  command: >
    docker run -d
    --name processor
    --env-file /etc/ca1/processor.env
    --restart unless-stopped
    processor
  changed_when: true

# Check that the processor container is actually running.
#
# Docker inspect also uses {{ }} syntax, so the inner expression is wrapped this way so Ansible passes
# {{.State.Running}} directly to Docker instead of trying to treat it as an Ansible variable.
- name: Confirm the processor container is actually running
  command: docker inspect -f "{{ '{{.State.Running}}' }}" processor
  register: processor_running
  changed_when: false
  failed_when: "'true' not in processor_running.stdout"
