---
# This role sets up MongoDB on the database VM.
# It only runs on the database machine because the other VMs do not need to run MongoDB.

# Create a folder where the MongoDB Docker Compose file will be stored on the database VM.
- name: Create Mongo directory
  file:
    path: /home/ubuntu/mongo
    state: directory
    mode: "0755"

# Create the MongoDB docker-compose.yml file from the Jinja2 template.
# The real username and password are filled in from the encrypted Ansible Vault variables.
#
# The file uses 0600 permissions because it contains the real MongoDB password after Ansible creates it.
- name: Template Mongo docker-compose.yml with vaulted credentials
  template:
    src: docker-compose.yml.j2
    dest: /home/ubuntu/mongo/docker-compose.yml
    mode: "0600"

# Make sure the MongoDB container is running the way the compose file describes.
#
# Ansible's Docker Compose module only reports a change when it really has to create, replace, or start
# the container. If MongoDB is already running with the right settings, running the playbook again does nothing.
- name: Start MongoDB
  community.docker.docker_compose_v2:
    project_src: /home/ubuntu/mongo
    state: present

# Check that the MongoDB container is actually running.
# The playbook will fail here if MongoDB is not listed as a running container.
- name: Confirm MongoDB container is running
  command: docker compose ps --status running
  args:
    chdir: /home/ubuntu/mongo
  register: mongo_status
  changed_when: false
  failed_when: "'mongodb' not in mongo_status.stdout"
