# NetworkPolicies: a firewall between the pods, inside the cluster.
#
# Without any policy every pod can talk to every other pod. These rules flip that around:
#   1. default-deny-all blocks all traffic into and out of every pod in the namespace.
#   2. Every other policy below then ADDS one allowed connection (policies only ever add allowed traffic).
# Result: the only traffic that works is exactly the pipeline  producer -> kafka -> processor -> mongo <- restapi,
# plus DNS, plus the REST API port for the outside world. Anything else (a stray pod, another namespace) is dropped.
#
# A NetworkPolicy only does something if the cluster's network plugin enforces it. k3s does (its built-in
# network-policy controller). Kubernetes health probes come from the node itself, which the network plugin lets through.
---
# 1. Deny everything, in both directions, for every pod in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ca2
  labels:
    app.kubernetes.io/part-of: ca2-pipeline
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 2. Every pod may ask the cluster DNS (CoreDNS in kube-system) to turn a name like "kafka" into an address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ca2
  labels:
    app.kubernetes.io/part-of: ca2-pipeline
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3. Kafka accepts connections only from the producer and the processor (port 9092).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress
  namespace: ca2
  labels:
    app.kubernetes.io/part-of: ca2-pipeline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: producer
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: processor
      ports:
        - protocol: TCP
          port: 9092
---
# 3b. The Kafka pod may talk to itself over its own pod IP (a harmless safety net for the broker and controller ports).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-self
  namespace: ca2
  labels:
    app.kubernetes.io/part-of: ca2-pipeline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
---
# 4. MongoDB accepts connections only from the processor and the REST API (port 27017).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-ingress
  namespace: ca2
  labels:
    app.kubernetes.io/part-of: ca2-pipeline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: processor
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: restapi
      ports:
        - protocol: TCP
          port: 27017
---
# 5. The processor's metrics port (the ClusterIP Service) may be read only by "observer" pods,
#    for example the smoke test, or a monitoring tool that carries this label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: processor-ingress
  namespace: ca2
  labels:
    app.kubernetes.io/part-of: ca2-pipeline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: processor
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: observer
      ports:
        - protocol: TCP
          port: 8000
---
# 6. The REST API is the one thing the outside world may reach: port 8080, from any source.
#    (On AWS the security group limits who can reach the node port in front of it.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restapi-ingress
  namespace: ca2
  labels:
    app.kubernetes.io/part-of: ca2-pipeline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restapi
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# 7. The producer may only connect to Kafka.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: producer-egress
  namespace: ca2
  labels:
    app.kubernetes.io/part-of: ca2-pipeline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: producer
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
---
# 8. The processor may connect to Kafka (to read) and to MongoDB (to write), nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: processor-egress
  namespace: ca2
  labels:
    app.kubernetes.io/part-of: ca2-pipeline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: processor
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mongo
      ports:
        - protocol: TCP
          port: 27017
---
# 9. The REST API may only connect to MongoDB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restapi-egress
  namespace: ca2
  labels:
    app.kubernetes.io/part-of: ca2-pipeline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: restapi
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mongo
      ports:
        - protocol: TCP
          port: 27017
---
# 10. An "observer" pod (the smoke test) may call the processor's metrics port and the REST API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observer-egress
  namespace: ca2
  labels:
    app.kubernetes.io/part-of: ca2-pipeline
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: observer
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: processor
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: restapi
      ports:
        - protocol: TCP
          port: 8080
