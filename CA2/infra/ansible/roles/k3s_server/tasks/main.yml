---
# Installs k3s as a Kubernetes server (control plane) on this machine.
# Every task checks first or is safe to repeat, so a second run reports changed=0.

- name: Find out which k3s version is installed (the output is empty when none is)
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_server_installed
  changed_when: false
  failed_when: false

- name: Download the pinned k3s installer (a changed or tampered script fails the checksum)
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh"
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
    checksum: "sha256:{{ k3s_installer_sha256 }}"

- name: Create the k3s configuration folder
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write the k3s server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: Install k3s and start it (skipped when this exact version is already installed)
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_version not in (k3s_server_installed.stdout | default(''))
  changed_when: true

- name: Make sure k3s is enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true

- name: Apply a changed configuration now, before anything waits on the API
  ansible.builtin.meta: flush_handlers

- name: Wait until the Kubernetes API is ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
  register: k3s_server_ready
  until: k3s_server_ready.rc == 0
  retries: 40
  delay: 5
  changed_when: false
