# Ansible settings for the CA2 cluster. Run "ansible-playbook site.yml" from this folder ("make cluster-up" does).
[defaults]
inventory = inventory.ini
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30

[ssh_connection]
pipelining = True
# Each machine's host key is remembered in the file "known_hosts" in this folder the first time Ansible connects
# (accept-new), and a changed key is refused after that. "make cluster-down" deletes the file, so a rebuilt
# cluster starts clean.
# IdentitiesOnly=yes makes SSH offer only the key named in the inventory. Without it, a laptop with many keys in
# its SSH agent can be refused with "Too many authentication failures" before the right key is tried.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=known_hosts -o IdentitiesOnly=yes
