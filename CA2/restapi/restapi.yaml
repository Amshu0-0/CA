# REST API: the serving stage.
# This file creates a Deployment and a NodePort Service.
#
# Two identical stateless replicas run behind one Service.
# If one pod restarts, another can still answer requests.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: restapi
  namespace: ca2
  labels:
    app.kubernetes.io/name: restapi
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ca2-pipeline

spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: restapi

  template:
    metadata:
      labels:
        app.kubernetes.io/name: restapi
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ca2-pipeline

    spec:
      serviceAccountName: restapi
      automountServiceAccountToken: false
      enableServiceLinks: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Try to place the two REST API replicas on different Kubernetes nodes
      # when more than one node is available.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: restapi

      # Kubernetes has no Docker Compose depends_on.
      # This init container waits until MongoDB accepts connections
      # before starting the REST API.
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w 2 mongo 27017; do echo waiting for mongo; sleep 3; done

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      containers:
        - name: restapi
          image: ghcr.io/amshu0-0/ca2-restapi:1.0.0
          imagePullPolicy: IfNotPresent

          # Shared non-secret settings come from pipeline-config.
          envFrom:
            - configMapRef:
                name: pipeline-config

          env:
            # Mongo credentials come from files mounted from the Secret.
            - name: MONGO_USER_FILE
              value: /etc/secrets/mongo/username

            - name: MONGO_PASSWORD_FILE
              value: /etc/secrets/mongo/password

          ports:
            - name: http
              containerPort: 8080

          volumeMounts:
            - name: mongo-credentials
              mountPath: /etc/secrets/mongo
              readOnly: true

          # Ready means the API can also reach MongoDB.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10

          # Alive means the web server itself is answering.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: mongo-credentials
          secret:
            secretName: mongo-credentials
            defaultMode: 288

---
# REST endpoint exposed outside the Kubernetes cluster.
#
# NodePort opens port 30080 on each Kubernetes node and forwards
# requests to the REST API pods on port 8080.
#
# Kafka and MongoDB remain internal ClusterIP Services.
# This REST API is the only application endpoint intentionally published.

apiVersion: v1
kind: Service
metadata:
  name: restapi
  namespace: ca2
  labels:
    app.kubernetes.io/name: restapi
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ca2-pipeline

spec:
  type: NodePort

  selector:
    app.kubernetes.io/name: restapi

  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
      protocol: TCP
