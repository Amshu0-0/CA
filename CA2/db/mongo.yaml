# MongoDB: the database stage of the pipeline.
# This file creates one StatefulSet and two Services.
#
# Why StatefulSet instead of Deployment?
# MongoDB needs a stable identity and its own persistent disk.
# The StatefulSet gives the pod a stable name (mongo-0) and a PVC that survives pod restarts.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: ca2
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ca2-pipeline
  annotations:
    description: "MongoDB 7 with its data on a PersistentVolumeClaim. The administrator name and password are read from files mounted from the Secret mongo-credentials"

spec:
  # The StatefulSet uses the headless Service for its stable network identity.
  serviceName: mongo-headless
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: mongo

  # Delete the disk when the StatefulSet is deleted,
  # but keep it if the StatefulSet is only scaled down.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: ca2-pipeline

    spec:
      serviceAccountName: mongo
      automountServiceAccountToken: false

      # Do not automatically inject environment variables for other Kubernetes Services.
      enableServiceLinks: false

      terminationGracePeriodSeconds: 60

      # The official image starts as root, takes ownership of the data disk, and then runs mongod as the user
      # "mongodb" (user and group ID 999). Kubernetes gives the files of a Secret to root and to nobody else, so
      # mongod could not read its password files. fsGroup makes group 999 the group of those files (see defaultMode below).
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: mongo
          image: mongo:7.0

          ports:
            - name: mongo
              containerPort: 27017

          env:
            # The official Mongo image reads these credentials from files.
            # Kubernetes mounts those files from the mongo-credentials Secret.
            - name: MONGO_INITDB_ROOT_USERNAME_FILE
              value: /etc/secrets/mongo/username

            - name: MONGO_INITDB_ROOT_PASSWORD_FILE
              value: /etc/secrets/mongo/password

          volumeMounts:
            # Persistent database storage.
            - name: data
              mountPath: /data/db

            # Mongo username and password from the Kubernetes Secret.
            - name: mongo-credentials
              mountPath: /etc/secrets/mongo
              readOnly: true

          # Ready when MongoDB is accepting connections.
          readinessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 10
            periodSeconds: 10

          # Restart the container if MongoDB stops responding.
          livenessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 6

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: mongo-credentials
          secret:
            secretName: mongo-credentials
            # 288 is the octal number 0440: the owner and the group (999, from fsGroup above) may read the files, nobody else.
            defaultMode: 288

  # Kubernetes creates a PersistentVolumeClaim from this template for the Mongo pod.
  # apiVersion, kind, volumeMode and status are the values Kubernetes fills in anyway. Writing them out keeps
  # "kubectl apply" from reporting "configured" on every run, so a second "make up" says "unchanged".
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          app.kubernetes.io/name: mongo
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: ca2-pipeline

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi

        volumeMode: Filesystem

      status:
        phase: Pending

---
# Headless Service:
# clusterIP: None means there is no virtual Service IP.
# It gives the StatefulSet pod a stable DNS identity such as
# mongo-0.mongo-headless.ca2.svc.cluster.local.

apiVersion: v1
kind: Service
metadata:
  name: mongo-headless
  namespace: ca2
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ca2-pipeline
  annotations:
    description: "Gives the MongoDB StatefulSet pod a stable DNS name (mongo-0.mongo-headless) instead of a virtual IP"

spec:
  clusterIP: None
  publishNotReadyAddresses: true

  selector:
    app.kubernetes.io/name: mongo

  ports:
    - name: mongo
      port: 27017
      targetPort: mongo

---
# ClusterIP Service:
# The other applications use the stable name "mongo" instead of knowing the Mongo pod's IP.
# This Service is reachable only from inside the Kubernetes cluster.

apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: ca2
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ca2-pipeline
  annotations:
    description: "Address of MongoDB inside the cluster (mongo:27017). Not reachable from outside the cluster"

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: mongo

  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
