# ServiceAccounts: the identity a pod uses when it talks to the Kubernetes API.
# One per workload, each with its API token turned OFF.
# None of the pipeline programs need to talk directly to the Kubernetes API,
# so their pods do not receive Kubernetes API credentials.
# The Roles that control what users may do are added later in the security step.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka
  namespace: ca2
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo
  namespace: ca2
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: processor
  namespace: ca2
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: producer
  namespace: ca2
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restapi
  namespace: ca2
automountServiceAccountToken: false
