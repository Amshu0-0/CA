# Producer: the source stage.
# A Job runs a pod to completion, which fits a one-off replay of the dataset:
# it sends all 5,000 flows to Kafka, exits, and is not restarted.
#
# To replay again:
# kubectl -n ca2 delete job producer-replay
# kubectl apply -f producer/job-replay.yaml

apiVersion: batch/v1
kind: Job
metadata:
  name: producer-replay
  namespace: ca2
  labels:
    app.kubernetes.io/name: producer
    app.kubernetes.io/component: replay-job
    app.kubernetes.io/part-of: ca2-pipeline

spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900

  template:
    metadata:
      labels:
        app.kubernetes.io/name: producer
        app.kubernetes.io/component: replay-job
        app.kubernetes.io/part-of: ca2-pipeline

    spec:
      serviceAccountName: producer
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Wait until Kafka accepts connections before starting the producer.
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          command:
            - sh
            - -c
            - until nc -z -w 2 kafka 9092; do echo waiting for kafka; sleep 3; done

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      containers:
        - name: producer
          image: ghcr.io/amshu0-0/ca2-producer:1.0.0
          imagePullPolicy: IfNotPresent

          # Load the shared pipeline settings from the ConfigMap.
          envFrom:
            - configMapRef:
                name: pipeline-config

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
