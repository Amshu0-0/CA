name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NLP
    strategy:
      fail-fast: false
      matrix:
        # 3.10 exercises pandas 2.x, 3.12 exercises pandas 3.x.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: NLP/requirements.txt

      # The CPU wheel avoids downloading several GB of CUDA libraries.
      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev]" openai

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest
