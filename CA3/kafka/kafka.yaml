# Kafka: the message bus stage.
# This file creates one StatefulSet and two Services.
#
# Why StatefulSet?
# Kafka stores its log on disk and clients are told the broker's exact name,
# so it needs a stable identity (kafka-0) and its own PersistentVolumeClaim.
#
# How Kafka is locked down (the three listeners):
#   SECURE      port 9092, on the pod's network address: the only one that other pods can reach. It speaks TLS, and it demands a client
#               certificate (ssl.client.auth=required). A client without a certificate that this stack's own certificate authority signed
#               is refused during the handshake, before it can send one byte of Kafka protocol. The producer and the processor each have
#               their own certificate (Secrets kafka-client-producer and kafka-client-processor).
#   ADMIN       port 9094, on the loopback address 127.0.0.1 INSIDE the pod, without TLS. Only processes in the Kafka pod can reach it:
#               the broker's own traffic between its parts, and the tools that the tests run with "kubectl exec" (topic and lag checks).
#               Nothing on the network can reach it, and the NetworkPolicies need no rule for it.
#   CONTROLLER  port 9093, also loopback only: the KRaft controller talks to the broker of the same pod.
# The listeners are not called PLAINTEXT or SSL on purpose: the Confluent image's start script treats a listener called SSL as a request
# for Java key stores with passwords. Kafka itself reads PEM files, which is what the Secret kafka-tls contains.
#
# Not done, and said so in the README: Kafka ACLs (which client may use which topic) and a read-only root file system.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ca3
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: ca3-pipeline
  annotations:
    description: "Kafka broker in KRaft mode (no ZooKeeper), one node. TLS with client certificates on port 9092; administration only on the loopback address inside the pod. New topics get 3 partitions. Messages are kept on a PersistentVolumeClaim"

spec:
  # The headless Service gives kafka-0 its stable DNS name.
  serviceName: kafka-headless
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: kafka

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain

  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: ca3-pipeline

    spec:
      serviceAccountName: kafka
      automountServiceAccountToken: false

      # Kubernetes normally injects environment variables for every Service.
      # A Service named kafka would create KAFKA_* variables.
      # The Confluent image also treats KAFKA_* variables as Kafka configuration,
      # so those automatic variables can interfere with the image.
      enableServiceLinks: false

      terminationGracePeriodSeconds: 120

      # The image's user is "appuser" with the number 1000. The number is written here because Kubernetes can only check
      # "runAsNonRoot" against a number. fsGroup 1000 makes the data disk and the files of the Secret readable and writable for the group 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.1

          ports:
            # Pipeline clients connect here, over TLS. (The administration and controller listeners are loopback-only: no port to publish.)
            - name: broker
              containerPort: 9092

          env:
            # Kubernetes fills these from the pod metadata.
            # They let Kafka advertise its own stable DNS name.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            # KRaft configuration:
            # this single Kafka node acts as both broker and controller.
            - name: KAFKA_NODE_ID
              value: "1"

            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:9093"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            # The three listeners (see the top of this file).
            - name: KAFKA_LISTENERS
              value: "SECURE://0.0.0.0:9092,ADMIN://127.0.0.1:9094,CONTROLLER://127.0.0.1:9093"

            # After a client first connects, Kafka tells it to use this stable pod DNS name. The certificate names it (see bootstrap.py).
            # The ADMIN address is for the clients that run inside the pod.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "SECURE://$(POD_NAME).kafka-headless.$(POD_NAMESPACE).svc.cluster.local:9092,ADMIN://127.0.0.1:9094"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "SECURE:SSL,ADMIN:PLAINTEXT,CONTROLLER:PLAINTEXT"

            # The broker's traffic between its own parts uses the loopback listener, so it never touches the network.
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "ADMIN"

            # TLS for the SECURE listener. The Secret kafka-tls is mounted at /etc/kafka-tls (volume below):
            #   keystore.pem  the broker's private key and certificate in one PEM file
            #   ca.pem        the certificate of the private CA, used to check the certificates that clients show
            - name: KAFKA_SSL_KEYSTORE_TYPE
              value: "PEM"

            - name: KAFKA_SSL_KEYSTORE_LOCATION
              value: "/etc/kafka-tls/keystore.pem"

            - name: KAFKA_SSL_TRUSTSTORE_TYPE
              value: "PEM"

            - name: KAFKA_SSL_TRUSTSTORE_LOCATION
              value: "/etc/kafka-tls/ca.pem"

            # "required" = mutual TLS: a client that shows no certificate, or one that the CA did not sign, is refused.
            - name: KAFKA_SSL_CLIENT_AUTH
              value: "required"

            # There is only one broker, so Kafka's internal topics use one replica.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            # New topics get three partitions.
            # This lets multiple processor replicas share work later during scaling.
            - name: KAFKA_NUM_PARTITIONS
              value: "3"

            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"

            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"

            # Fixed KRaft cluster ID used when Kafka initializes its storage.
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"

          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data

            # The broker's certificate and key, and the CA certificate.
            - name: kafka-tls
              mountPath: /etc/kafka-tls
              readOnly: true

          # Kafka can take time to initialize its disk.
          # The startup probe gives it time before normal health checks begin.
          # The probes only open a TCP connection to port 9092 and close it again (no TLS handshake): enough to know that the broker listens.
          startupProbe:
            tcpSocket:
              port: broker
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 20
            failureThreshold: 6

          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: kafka-tls
          secret:
            secretName: kafka-tls
            # 288 is the octal number 0440: the owner and the group (1000, from fsGroup above) may read the files, nobody else.
            defaultMode: 288

  # Each Kafka pod gets its own persistent disk from this template.
  # apiVersion, kind, volumeMode and status are the values Kubernetes fills in anyway. Writing them out keeps
  # "kubectl apply" from reporting "configured" on every run, so a second "make up" says "unchanged".
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          app.kubernetes.io/name: kafka
          app.kubernetes.io/component: broker
          app.kubernetes.io/part-of: ca3-pipeline

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi

        volumeMode: Filesystem

      status:
        phase: Pending

---
# Headless Service:
# gives kafka-0 the stable DNS name
# kafka-0.kafka-headless.ca3.svc.cluster.local.
# Kafka advertises this name to its clients.

apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: ca3
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: ca3-pipeline
  annotations:
    description: "Gives the Kafka StatefulSet pod a stable DNS name (kafka-0.kafka-headless) instead of a virtual IP. Kafka advertises this name to its clients"

spec:
  clusterIP: None
  publishNotReadyAddresses: true

  selector:
    app.kubernetes.io/name: kafka

  ports:
    - name: broker
      port: 9092
      targetPort: broker

---
# ClusterIP Service:
# pipeline clients first connect to kafka:9092 (over TLS, with a client certificate).
# Kafka then gives them the broker's advertised stable DNS address.
# The KRaft controller and the administration listener are not exposed at all (loopback only).

apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ca3
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: ca3-pipeline
  annotations:
    description: "Address of the Kafka broker inside the cluster (kafka:9092, TLS with client certificates). Not reachable from outside the cluster"

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: kafka

  ports:
    - name: broker
      port: 9092
      targetPort: broker
