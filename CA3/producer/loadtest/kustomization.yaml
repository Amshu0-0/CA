# Overlay "load on": the producer load generator and its autoscaler as producer/load defines them, with one change: the Deployment sends
# (PRODUCER_IDLE=false) instead of waiting. The autoscaler is the one of the stack: 1 to 5 pods, 50 percent CPU.
#   kubectl apply -k producer/loadtest      switch the load on
#   kubectl apply -k producer/load          switch it off again (the idle producers; the autoscaler shrinks to one pod)
# "make scale-test" does exactly this, and measures what happens.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../load
patches:
  - path: load-on.yaml
