# Producer: the source stage.
# A Job runs a pod to completion, which fits a one-off replay of the dataset:
# it sends all 5,000 flows to Kafka, exits, and is not restarted.
# The producer talks to Kafka over TLS and shows its own client certificate (Secret kafka-client-producer). Without that certificate
# Kafka would not let it send anything.
#
# To replay again:
# kubectl -n ca3 delete job producer-replay
# kubectl apply -f producer/job-replay.yaml

apiVersion: batch/v1
kind: Job
metadata:
  name: producer-replay
  namespace: ca3
  labels:
    app.kubernetes.io/name: producer
    app.kubernetes.io/component: replay-job
    app.kubernetes.io/part-of: ca3-pipeline
  annotations:
    description: "The producer stage of the stack: replays the 5,000-row dataset into Kafka once and ends. Delete the Job and apply again to replay"

spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900

  template:
    metadata:
      labels:
        app.kubernetes.io/name: producer
        app.kubernetes.io/component: replay-job
        app.kubernetes.io/part-of: ca3-pipeline

    spec:
      serviceAccountName: producer
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure

      # fsGroup 1000 makes the files of the Secret below readable for the group 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Wait until Kafka accepts connections before starting the producer.
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          command:
            - sh
            - -c
            - until nc -z -w 2 kafka 9092; do echo waiting for kafka; sleep 3; done

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      containers:
        - name: producer
          image: ghcr.io/amshu0-0/ca3-producer:1.0.0
          imagePullPolicy: IfNotPresent

          # Load the shared pipeline settings from the ConfigMap.
          envFrom:
            - configMapRef:
                name: pipeline-config

          # Prometheus reads the numbers of the producer here (PRODUCER_METRICS_PORT in pipeline-config).
          ports:
            - name: metrics
              containerPort: 8001

          volumeMounts:
            # The producer's Kafka client certificate and key, and the CA certificate (the paths are in the ConfigMap pipeline-config).
            - name: kafka-client-producer
              mountPath: /etc/pki/kafka-client
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        # 288 is the octal number 0440: the owner and the group (1000, from fsGroup) may read the files, nobody else.
        - name: kafka-client-producer
          secret:
            secretName: kafka-client-producer
            defaultMode: 288
