# Producer load generator: part of the stack, and idle until the scaling test switches the load on.
#
# Unlike the one-off replay Job, this is a Deployment: it replays the dataset again and again (REPLAY_FOREVER=true), so each replica keeps
# its CPU busy and keeps sending, and the HorizontalPodAutoscaler in hpa.yaml adds replicas while the CPU is busy.
#
# It is part of "kubectl apply -k ." but it sends nothing: PRODUCER_IDLE=true makes each pod connect to Kafka (over TLS, with its client
# certificate, which proves that the certificate works) and wait. A pod that waits uses almost no CPU, so the autoscaler keeps exactly one.
# The scaling test switches the load on by applying one of two overlays (kubectl apply -k), which only change PRODUCER_IDLE:
#   producer/loadtest      load on, 1 to 5 pods
#   producer/loadtest-one  load on, the autoscaler held at 1 pod (the "before" measurement)
# Applying this folder again ("kubectl apply -k producer/load", or the whole stack with "kubectl apply -k .") switches the load off: the
# pods are replaced by idle ones, the CPU falls, the autoscaler shrinks the Deployment back to one pod. That is the shrink phase of the scaling test.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-load
  namespace: ca3
  labels:
    app.kubernetes.io/name: producer
    app.kubernetes.io/component: load-generator
    app.kubernetes.io/part-of: ca3-pipeline
  annotations:
    description: "Continuous producer for the scaling test; idle (sends nothing) until an overlay in producer/loadtest switches the load on; replica count is managed by the HorizontalPodAutoscaler"
spec:
  # No "replicas": the HorizontalPodAutoscaler owns it (starts at 1).
  selector:
    matchLabels:
      app.kubernetes.io/name: producer
      app.kubernetes.io/component: load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: producer
        app.kubernetes.io/component: load-generator
        app.kubernetes.io/part-of: ca3-pipeline
    spec:
      serviceAccountName: producer
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Spread the replicas over different nodes when possible, so the scale-up really uses the whole cluster.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: producer
              app.kubernetes.io/component: load-generator
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 kafka 9092; do echo waiting for kafka; sleep 3; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      containers:
        - name: producer
          image: ghcr.io/amshu0-0/ca3-producer:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pipeline-config
          env:
            - name: REPLAY_FOREVER
              value: "true"
            # true = connect and wait, send nothing. The overlays in producer/loadtest set it to false.
            - name: PRODUCER_IDLE
              value: "true"
          # Prometheus reads the numbers of each replica here (PRODUCER_METRICS_PORT in pipeline-config).
          ports:
            - name: metrics
              containerPort: 8001
          volumeMounts:
            - name: kafka-client-producer
              mountPath: /etc/pki/kafka-client
              readOnly: true
          # Each replica may use up to 5 times its CPU request, so a busy producer pushes the average utilisation
          # far above the autoscaler's target and the scale-up starts quickly.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        # 288 is the octal number 0440: the owner and the group (1000, from fsGroup) may read the files, nobody else.
        - name: kafka-client-producer
          secret:
            secretName: kafka-client-producer
            defaultMode: 288
