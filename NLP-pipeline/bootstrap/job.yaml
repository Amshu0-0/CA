# Bootstrap: makes the Secrets of the stack, inside the cluster, so that "kubectl apply -k ." is all it takes.
#
# What it makes (the program is producer/bootstrap.py, in the producer image, and it is documented at its top):
#   random passwords for MongoDB (administrator, processor, REST API, metrics reader), for the REST API login and for Grafana,
#   a private certificate authority, and the certificates for Kafka, MongoDB, the REST API, the producer, the processor and the Kafka metrics reader.
# Each result is its own Secret (13): mongo-root, mongo-processor, mongo-restapi, mongo-exporter, restapi-login, grafana-admin, pki-ca,
# kafka-tls, kafka-client-producer, kafka-client-processor, kafka-client-exporter, mongo-tls and restapi-tls. The CA's private key is never stored anywhere.
#
# How the order works: the pods of MongoDB, Kafka, the processor and the REST API mount these Secrets. Until a Secret exists, the
# kubelet cannot start such a pod and keeps retrying, so everything starts by itself a short while after this Job ends.
#
# Running it again is safe: if all 13 Secrets exist it does nothing; if only some exist it refuses (new certificates would not
# match the old ones) and "make down" removes everything. A Job's pod template cannot be changed once the Job exists, so after a new
# version of this file "make up" deletes the finished Job first (it makes no new Secrets when the old ones are there).
#
# The pod is the only one in the namespace with a Kubernetes API token. The NetworkPolicy "bootstrap-egress" lets it reach the API
# server and nothing else, and the Role "bootstrap" lets it create Secrets and nothing else.

apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap
  namespace: nlp
  labels:
    app.kubernetes.io/name: bootstrap
    app.kubernetes.io/component: setup-job
    app.kubernetes.io/part-of: nlp-pipeline
  annotations:
    description: "Creates the passwords, the private certificate authority and the certificates as Secrets, once. Needs no script outside the cluster"

spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap
        app.kubernetes.io/component: setup-job
        app.kubernetes.io/part-of: nlp-pipeline

    spec:
      serviceAccountName: bootstrap

      # The ServiceAccount has its token turned off. This pod turns it on for itself: it needs the token to call the API server.
      automountServiceAccountToken: true
      enableServiceLinks: false
      restartPolicy: OnFailure

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: bootstrap
          image: ghcr.io/amshu0-0/nlp-producer:1.0.0
          imagePullPolicy: IfNotPresent

          # The producer image also carries bootstrap.py (the processor image is large because of PyTorch, so this small one is used). Only the command differs.
          command: ["python", "-u", "bootstrap.py"]

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
