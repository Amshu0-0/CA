# ServiceAccounts: the identity a pod uses when it talks to the Kubernetes API.
# One per workload, each with its API token turned OFF.
# None of the pipeline programs need to talk directly to the Kubernetes API,
# so their pods do not receive Kubernetes API credentials.
# The one exception is the setup Job "bootstrap" (last account below): its pod turns the token on for itself, and its Role
# (rbac/bootstrap.yaml) allows it to create Secrets and nothing else.
# The Roles that control what users may do are in rbac/roles.yaml.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka
  namespace: nlp
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: nlp-pipeline
  annotations:
    description: "Identity of the Kafka pod. Its Kubernetes API token is not mounted, because Kafka never calls the Kubernetes API"
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo
  namespace: nlp
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: nlp-pipeline
  annotations:
    description: "Identity of the MongoDB pod. Its Kubernetes API token is not mounted, because MongoDB never calls the Kubernetes API"
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: processor
  namespace: nlp
  labels:
    app.kubernetes.io/name: processor
    app.kubernetes.io/part-of: nlp-pipeline
  annotations:
    description: "Identity of the processor pods. Its Kubernetes API token is not mounted, because the processor never calls the Kubernetes API"
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: producer
  namespace: nlp
  labels:
    app.kubernetes.io/name: producer
    app.kubernetes.io/part-of: nlp-pipeline
  annotations:
    description: "Identity of the producer Jobs and pods. Its Kubernetes API token is not mounted, because the producer never calls the Kubernetes API"
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restapi
  namespace: nlp
  labels:
    app.kubernetes.io/name: restapi
    app.kubernetes.io/part-of: nlp-pipeline
  annotations:
    description: "Identity of the REST API pods. Its Kubernetes API token is not mounted, because the REST API never calls the Kubernetes API"
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootstrap
  namespace: nlp
  labels:
    app.kubernetes.io/name: bootstrap
    app.kubernetes.io/part-of: nlp-pipeline
  annotations:
    description: "Identity of the setup Job. The token is off here and turned on only in the Job's pod (bootstrap/job.yaml). Its Role may create Secrets and nothing else"
automountServiceAccountToken: false
