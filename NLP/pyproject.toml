[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logad"
version = "0.1.0"
description = "Comparing LogBERT and rule-guided LLMs for system log anomaly detection on BGL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "drain3>=0.9.11",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear, UP: pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is enforced by `ruff format`; docstrings may quote long raw log lines.
ignore = ["E501"]
