# =============================================================================
# Full BGL on a CPU-only machine (4 cores, no GPU).
#
# Same data, split, windows and LogBERT architecture as configs/bgl.yaml. Only
# the amount of LogBERT training is reduced so that it finishes in about an
# hour and a half: duplicate sequences are dropped, the hypersphere centre is
# estimated from fewer sequences, and fewer epochs run. Results from this
# config are reported as a reduced-training run; on a GPU, use
# configs/bgl.yaml instead.
#
#   python scripts/train_logbert.py --config configs/bgl_cpu.yaml
#   python scripts/evaluate_logbert.py --config configs/bgl_cpu.yaml
# =============================================================================

extends: bgl.yaml
name: bgl_cpu

paths:
  # Same preprocessed data as the full run; separate outputs so a later GPU
  # run with configs/bgl.yaml never mixes with these results.
  output_dir: outputs/bgl_cpu

logbert:
  # On full BGL, 35,035 normal training chunks hold only 12,394 distinct
  # sequences (3.2M keys): overlapping windows repeat the same alert storms.
  # Training on the distinct ones keeps every pattern at about 1/4 of the cost
  # (measured on 4 cores: ~3,300 keys/s at length 512).
  dedupe_sequences: true
  max_train_sequences: null
  center_samples: 4000                # centre re-estimated every epoch
  epochs: 6
  patience: 3
  warmup_steps: 200
  device: cpu

# Approach B on the same CPU. Qwen2.5-7B-Instruct comes from Qwen's official
# Q4_K_M GGUF build, served by llama-cpp-python's OpenAI-compatible server
# (Ollama's installer could not be downloaded here):
#   python -m llama_cpp.server --model <q4_k_m-00001-of-00002.gguf> \
#       --model_alias qwen2.5:7b-instruct --n_ctx 8192 --n_threads 4 --port 8000
llm:
  generator:
    base_url: http://localhost:8000/v1
  classifier:
    base_url: http://localhost:8000/v1

# A 7B model on 4 cores answers in seconds, not milliseconds, so the LLM work
# is cut to what the reported result needs: one induction round over all 442
# training templates, and only the 472 templates of the test period.
rules:
  rounds: 1

deduction:
  splits: [test]
