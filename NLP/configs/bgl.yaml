# =============================================================================
# Experiment configuration: BlueGene/L (BGL) system logs from Loghub.
#
# Every script in scripts/ reads this file. Any value can be overridden on the
# command line, e.g.  python scripts/<script>.py --set seed=7
# =============================================================================

name: bgl
seed: 42

paths:
  raw_log: data/raw/BGL.log           # downloaded by scripts/download_data.py
  processed_dir: data/processed/bgl   # written by scripts/preprocess.py
  output_dir: outputs/bgl             # checkpoints, predictions, metrics

# Drain template extraction - same settings as the LogBERT repo for BGL.
parsing:
  depth: 3
  similarity_threshold: 0.3
  max_children: 100
  masking:                            # replaced by <*> before parsing
    - '(0x)[0-9a-fA-F]+'              # hexadecimal numbers
    - '\d+\.\d+\.\d+\.\d+'            # IPv4 addresses
    - '\d+'                           # any other integer

# Chronological split: earliest 60% of the timeline for training, next 20%
# for validation (tuning), last 20% for testing. Never random (Le & Zhang 2022).
split:
  by: time                            # "time" (timeline) or "messages" (count)
  train: 0.6
  val: 0.2
  test: 0.2

# Shared evaluation unit: 5-minute windows sliding by 1 minute (LogBERT BGL).
# A window is anomalous if it contains at least one alert message.
windows:
  size_seconds: 300
  step_seconds: 60

# Approach A: LogBERT. Two-layer encoder as in the paper; other settings
# follow the LogBERT repository's BGL options where it specifies them.
logbert:
  hidden: 256
  layers: 2
  heads: 4
  ff_dim: 1024
  dropout: 0.1
  max_len: 512                        # incl. <dist>; longer windows are chunked
  min_len: 10                         # skip shorter training windows (LogBERT)
  dev_fraction: 0.1                   # last 10% of normal train windows -> early stopping
  max_train_sequences: null           # e.g. 20000 for a quick CPU run
  mask_ratio: 0.5
  vhm_weight: 0.1                     # loss = MLKP + 0.1 * VHM
  center_samples: 20000
  batch_size: 64
  learning_rate: 1.0e-3
  weight_decay: 0.0
  warmup_steps: 500
  grad_clip: 1.0
  epochs: 50
  patience: 5
  device: auto                        # cuda > mps > cpu
  detection:                          # g and r are tuned on the validation period
    mask_ratio: 0.5
    full_coverage: false              # true = our extension: check every key once
    g_values: [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20]
    r_max: 20
    batch_size: 128
    seed: 1234
