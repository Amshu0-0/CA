# =============================================================================
# Full BGL on a GPU (Google Colab): LogBERT trained with the full recipe.
#
# The data, split, windows and the LogBERT architecture are those of
# configs/bgl_cpu.yaml, the run that is reported in results/. What differs is
# only the amount of LogBERT training, which is the one thing that the CPU run
# had to cut down:
#
#                      bgl_cpu.yaml (results/)      bgl_gpu.yaml (results_gpu/)
#   duplicate chunks   dropped (12,394 kept)        kept (every chunk, duplicates too)
#   centre samples     4,000                        20,000
#   epochs / patience  6 / 3                        up to 50 / 5 (early stopping)
#   warm-up steps      200                          500
#   device             cpu                          auto (the GPU)
#
# Approach B keeps the scope of the reported run (one induction round, test
# period only); the notebook runs it again with Qwen2.5-7B-Instruct on the GPU.
# =============================================================================

extends: bgl_cpu.yaml
name: bgl_gpu

paths:
  # Separate outputs so that nothing of the reported CPU run is overwritten.
  output_dir: outputs/bgl_gpu

logbert:
  dedupe_sequences: false
  max_train_sequences: null
  center_samples: 20000
  epochs: 50
  patience: 5
  warmup_steps: 500
  device: auto
